- hosts: localhost
  become: true
  pre_tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

  tasks:
    - import_tasks: tasks/packages.yml
    - import_tasks: tasks/docker.yaml
    - import_tasks: tasks/node.yaml
    - import_tasks: tasks/vscode_extensions.yaml
