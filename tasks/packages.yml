- name: Install core development tools
  apt:
    name:
      - git
      - curl
      - wget
      - build-essential
      - htop
      - unzip
      - gnupg
      - software-properties-common
      - apt-transport-https
      - ca-certificates
      - jq
      - ripgrep
      - tmux
      - sqlite3
    state: present

- name: Install Python development packages
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - python3-dev
      - python3-setuptools
    state: present

- name: Install pip tools globally
  pip:
    name:
      - virtualenv
      - pipx
      - uv
      - ruff
      - black
    state: present
    executable: pip3

- name: Add GitHub CLI GPG key
  apt_key:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    state: present

- name: Add GitHub CLI repository
  apt_repository:
    repo: "deb [arch=amd64] https://cli.github.com/packages stable main"
    state: present

- name: Install GitHub CLI
  apt:
    name: gh
    state: present
    update_cache: true

- name: Install VSCode via snap
  community.general.snap:
    name: code
    classic: true
    state: present
